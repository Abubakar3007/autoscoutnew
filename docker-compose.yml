version: "3.9"

services:
  client:
    build: .
    container_name: nextjs_container
    ports:
      - "3000:3000"
    restart: always

    volumes:
      - .:/app
      - /app/node_modules

    environment:
      - CHOKIDAR_USEPOLLING=true

    command: npm run dev

  backend:
    build: ./backend
    container_name: node_backend
    ports:
      - "5000:5000"

    restart: always

    volumes:
      - ./backend:/app
      - /app/node_modules

    env_file:
      - ./backend/.env

    command: npm run dev
